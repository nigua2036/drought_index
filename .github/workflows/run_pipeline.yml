name: Run Drought Index Workflow
run-name: ${{ github.actor }} is running snakemake workflow 🚀
on: 
#[push]
  schedule:
    - cron: '29 12 * * *'
permissions:
  contents: write
jobs:
  Run-Drought-Index-Workflow:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v6
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls 
      - name: Get working-directory
        run: |
          pwd
      - name: Snakemake workflow
        uses: snakemake/snakemake-github-action@v2
        with:
          directory: "."
          snakefile: "Snakefile"
          args: "--cores 1 --sdm conda --conda-cleanup-pkgs cache"
          stagein: "" # additional preliminary commands to run (can be multiline)
          show-disk-usage-on-error: true
      - name: Configure git on runner
        run: |
          git config --local user.emal "noreply@github.com"
          git config --local user.name "GitHub"
      - name: Commit changes to repository
        run: |
          git add figures/world_drought.png index.html
          git commit -m "New day's rendering"
          git push origin main
      - run: echo "🍏 This job's status is ${{ job.status }}."
